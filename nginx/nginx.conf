upstream user_service {
    server user-service:5000;
}

upstream admin_service {
    server admin-service:7000;
}

upstream song_service {
    server song-service:8000;
}

server {
    listen 8085;
    listen [::]:8085;
    server_name _;

    # Allow large file uploads for audio/image content
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;

    # User service — auth, profile, playlist
    location /api/users {
        proxy_pass http://user_service;
    }

    # Song service — read-only album/song data
    location /api/songs {
        proxy_pass http://song_service;
    }

    # Admin service — content management (multipart uploads)
    location /api/admin {
        proxy_pass http://admin_service;
        proxy_request_buffering off;
    }

    # Gateway health check
    location /health {
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }
}
