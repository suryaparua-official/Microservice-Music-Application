services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: music-mongodb
    restart: unless-stopped
    networks:
      - music-internal
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicapp
      POSTGRES_PASSWORD: musicapp
      POSTGRES_DB: musicapp
    networks:
      - music-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicapp -d musicapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - music-internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend Services ──────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: music-user-service
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/music-app
      JWT_SEC: ${JWT_SEC}
      FRONTEND_URL: http://localhost
    networks:
      - music-internal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: music-admin-service
    restart: unless-stopped
    environment:
      PORT: 7000
      DB_URL: postgresql://musicapp:musicapp@postgres:5432/musicapp
      User_URL: http://user-service:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      Cloud_Name: ${Cloud_Name}
      Cloud_Api_Key: ${Cloud_Api_Key}
      Cloud_Scret_Key: ${Cloud_Scret_Key}
      FRONTEND_URL: http://localhost
    networks:
      - music-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  song-service:
    build:
      context: ./backend/song-service
      dockerfile: Dockerfile
    container_name: music-song-service
    restart: unless-stopped
    environment:
      PORT: 8000
      DB_URL: postgresql://musicapp:musicapp@postgres:5432/musicapp
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: http://localhost
    networks:
      - music-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── API Gateway ───────────────────────────────────────────────────────────────

  api-gateway:
    image: nginx:alpine
    container_name: music-api-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    networks:
      - music-internal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8085
        VITE_ADMIN_SERVER_URL: http://localhost:8085
    container_name: music-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - music-internal
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Volumes ────────────────────────────────────────────────────────────────────

volumes:
  mongodb_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────

networks:
  music-internal:
    driver: bridge
